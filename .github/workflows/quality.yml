# Craftbook quality gates (templates/ci.yml, chapter 8 §8.5), with this
# project's own job at the end.
name: quality

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  # The Craftbook version this project follows; bumped by the project's own PR.
  CRAFTBOOK_REF: main

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
          # Needed while Craftbook is private: a fine-grained token that can read it.
          token: ${{ secrets.CRAFTBOOK_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: python3 .craftbook/tools/craftcheck check . --baseline .craftcheck-baseline
      - run: python3 .craftbook/tools/craftcheck deps . --baseline .craftcheck-deps-baseline

  fmt-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # The nightly-only rustfmt options of templates/rustfmt.toml (chapter 1 §1.7).
      - run: cargo +nightly fmt --all --check -- --config group_imports=StdExternalCrate,imports_granularity=Module

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
          # Needed while Craftbook is private: a fine-grained token that can read it.
          token: ${{ secrets.CRAFTBOOK_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      - run: cargo test --workspace --all-features
      # llvm-cov on stable does not run doc tests; they run here.
      - run: cargo test --workspace --all-features --doc
      - name: coverage per crate, threshold by layer (chapter 8 §8.1)
        run: |
          set -eu
          gate() { # layer min-lines min-regions
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$1"); do
              echo "== $crate ($1): lines >= $2 %, regions >= $3 %"
              cargo llvm-cov --package "$crate" --all-features --fail-under-lines "$2" --fail-under-regions "$3"
            done
          }
          gate shared-kernel 95 90
          gate domain 90 85
          gate app 85 80
          gate infra 70 0
      - name: coverage of changed lines >= 90 % (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          packages=""
          for layer in shared-kernel domain app; do
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$layer"); do
              packages="$packages --package $crate"
            done
          done
          [ -n "$packages" ] || exit 0
          cargo llvm-cov $packages --all-features --lcov --output-path lcov.info
          pipx run diff-cover lcov.info --compare-branch "origin/${{ github.base_ref }}" --fail-under 90
      - run: cargo deny check
      - run: cargo doc --workspace --no-deps --all-features

  mutants:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
          # Needed while Craftbook is private: a fine-grained token that can read it.
          token: ${{ secrets.CRAFTBOOK_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: mutation score per crate, threshold by layer (chapter 8 §8.1)
        run: |
          set -u
          status=0
          gate() { # layer min-score
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$1"); do
              # cargo-mutants exits non-zero on any missed mutant; the score decides.
              cargo mutants --package "$crate" --timeout 120 --output "mutants-$crate" || true
              python3 .craftbook/tools/mutation_score.py "mutants-$crate/mutants.out/outcomes.json" "$2" || status=1
            done
          }
          gate shared-kernel 85
          gate domain 80
          gate app 70
          exit $status

  miri:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The crate with unsafe code: the AVX2 bit-packing kernels (chapter 4 §4.6).
      - run: cargo +nightly miri test --package substrate-data --lib

  # Without optional features, and the benchmarks built.
  features-and-benches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo bench --workspace --no-run
