[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.92"
authors = ["F000NK"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/F000NKKK/Substrate-Data"

[workspace.dependencies]
substrate-data = { path = "crates/substrate-data", version = "0.2.1" }
substrate-data-derive = { path = "crates/substrate-data-derive", version = "0.2.1" }
base64 = "0.23"
memchr = "=2.8.3"
simdutf8 = "=0.1.5"
bumpalo = { version = "3", features = ["collections"] }
toml = { version = "1", default-features = false }
serde_spanned = "1"
serde_json = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
criterion = { version = "0.8", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
cognitive_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
module_name_repetitions = "warn"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_imports = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
mod_module_files = "allow"
self_named_module_files = "deny"
large_types_passed_by_value = "warn"
shadow_unrelated = "warn"
