[package]
name = "substrate-data"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = "README.md"
documentation = "https://docs.rs/substrate-data"
description = "One data model, text syntax, binary form, packed frames and schema system — for any program's files, saves and wire messages."
keywords = ["serialization", "schema", "binary", "json5", "format"]
categories = ["encoding", "parser-implementations"]

[dependencies]
substrate-data-derive = { workspace = true }
base64 = { workspace = true }
# Vectorised byte search (runtime-dispatched) for the text parser's scans.
memchr = { workspace = true, features = ["std"] }
# The arena borrowed values' lists and maps live in (`ValueRef`).
bumpalo = { workspace = true }
# TOML read into the model (`toml` feature).
toml = { workspace = true, features = ["std", "parse", "preserve_order"], optional = true }
serde_spanned = { workspace = true, optional = true }
# SIMD UTF-8 validation (`simd-utf8` feature).
simdutf8 = { workspace = true, features = ["std"], optional = true }
# JSON ⇄ the model (`json` feature).
serde_json = { workspace = true, optional = true }

[features]
toml = ["dep:toml", "dep:serde_spanned"]
json = ["dep:serde_json"]
simd-utf8 = ["dep:simdutf8"]

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
serde_json = { workspace = true }

[[bench]]
name = "data"
harness = false

[[bench]]
name = "messages"
harness = false

[lints]
workspace = true
