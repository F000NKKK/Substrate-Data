[package]
name = "substrate-data-derive"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = "README.md"
documentation = "https://docs.rs/substrate-data-derive"
keywords = ["serialization", "schema", "derive"]
categories = ["encoding"]
description = "#[derive(Schema)] for substrate-data."

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
# Where `substrate_data` is for the crate deriving (its own dependency, or a re-export).
proc-macro-crate = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# What the derive expands against. Path only, no version: the dependency
# cycle is dev-only, and cargo drops a versionless dev-dependency on publish,
# so the derive can be published before the crate that re-exports it.
substrate-data = { path = "../substrate-data" }
