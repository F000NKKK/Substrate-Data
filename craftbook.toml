# Craftbook configuration: the layer map and the exemptions, each with its
# reason (rust/06-tooling.md).

[[crate]]
name = "substrate-data"
layer = "shared-kernel"
context = "data"

[[crate]]
name = "substrate-data-derive"
layer = "shared-kernel"
context = "data"

[[exempt]]
path = "crates/substrate-data/src/model/atom/table.rs"
reason = "an atom is a number in the process's one name table; a runtime installs it once so every copy of the crate (dylibs) shares it (ch. 4 §4.7)"
codes = ["A501"]

[[exempt]]
path = "crates/substrate-data/src/model/atom/local.rs"
reason = "the process's name table when no runtime installs one: the global the atom table is"
codes = ["A501"]

[[exempt]]
path = "crates/substrate-data/src/wire/frame/floats/narrowing.rs"
reason = "the processor's float kernels, chosen once by CPU feature and read-only after"
codes = ["A501"]

[[exempt]]
path = "crates/substrate-data/src/wire/frame/lanes/packing.rs"
reason = "the processor's bit-packing kernels, chosen once by CPU feature and read-only after"
codes = ["A501"]

[[exempt]]
path = "crates/substrate-data-derive/src/lib.rs"
reason = "a proc-macro crate's derive entry point must be a function at its root; it only forwards to expand::derive"
codes = ["C103"]

[[exempt]]
path = "crates/substrate-data/tests/io_no_alloc.rs"
reason = "a test's counting global allocator: the allocator is process-wide by definition; the count is per thread so parallel tests don't see each other's"
codes = ["A501"]

[[exempt]]
path = "crates/substrate-data/Cargo.toml"
reason = "the optional `tokio` feature (off by default) pulls tokio's `io-util` for `io::asynchronous`: the AsyncRead/AsyncWrite traits only, no runtime; the default build has no async dependency"
codes = ["L604"]

[[exempt]]
path = "crates/substrate-data/src/wire/io/asynchronous/*"
reason = "frames over a byte stream are I/O by definition and async is for genuine I/O only (a socket or pipe waits); this module is the stream edge of `io`, behind the `tokio` feature, and encoding and decoding stay synchronous"
codes = ["L605"]
