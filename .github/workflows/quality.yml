# Craftbook quality gates (templates/ci.yml, chapter 8 §8.5), with this
# project's own job at the end.
name: quality

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  # The Craftbook version this project follows; bumped by the project's own PR.
  CRAFTBOOK_REF: main

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: python3 .craftbook/tools/craftcheck check . --baseline .craftcheck-baseline
      - run: python3 .craftbook/tools/craftcheck deps . --baseline .craftcheck-deps-baseline

  fmt-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # The nightly-only rustfmt options of templates/rustfmt.toml (chapter 1 §1.7).
      - run: cargo +nightly fmt --all --check -- --config group_imports=StdExternalCrate,imports_granularity=Module

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      - run: cargo test --workspace --all-features
      # llvm-cov on stable does not run doc tests; they run here.
      - run: cargo test --workspace --all-features --doc
      # The per-instruction-set kernels (lanes/sse42.rs, avx2.rs, avx512.rs, neon.rs)
      # run only where the machine has the instructions, which a hosted runner
      # does not promise (AVX-512), so their coverage would depend on the
      # runner's luck. They are tested for byte-identity with the portable
      # code by the simd-backends job instead, on x86-64 and AArch64.
      - name: coverage per crate, threshold by layer (chapter 8 §8.1)
        env:
          ISA_FILES: 'wire/frame/lanes/(sse42|avx2|avx512|neon)\.rs$'
        run: |
          set -eu
          gate() { # layer min-lines min-regions
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$1"); do
              echo "== $crate ($1): lines >= $2 %, regions >= $3 %"
              cargo llvm-cov --package "$crate" --all-features --ignore-filename-regex "$ISA_FILES" --fail-under-lines "$2" --fail-under-regions "$3"
            done
          }
          gate shared-kernel 95 90
          gate domain 90 85
          gate app 85 80
          gate infra 70 0
      - name: coverage of changed lines >= 90 % (pull requests)
        if: github.event_name == 'pull_request'
        env:
          ISA_FILES: 'wire/frame/lanes/(sse42|avx2|avx512|neon)\.rs$'
        run: |
          set -eu
          packages=""
          for layer in shared-kernel domain app; do
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$layer"); do
              packages="$packages --package $crate"
            done
          done
          [ -n "$packages" ] || exit 0
          cargo llvm-cov $packages --all-features --ignore-filename-regex "$ISA_FILES" --lcov --output-path lcov.info
          pipx run diff-cover lcov.info --compare-branch "origin/${{ github.base_ref }}" --fail-under 90
      - run: cargo deny check
      - run: cargo doc --workspace --no-deps --all-features

  # Every instruction set a processor can run is tested on the processors the
  # runners have: x86-64 (SSE4.2, AVX2, and AVX-512 where the machine has it)
  # and AArch64 (NEON). The test prints which backends it ran.
  simd-backends:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p substrate-data --test lane_backends -- --nocapture
      - run: cargo test -p substrate-data --lib frame

  mutants:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: mutation score per crate, threshold by layer (chapter 8 §8.1)
        run: |
          set -u
          status=0
          gate() { # layer min-score
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$1"); do
              # cargo-mutants exits non-zero on any missed mutant; the score decides.
              cargo mutants --package "$crate" --timeout 120 --output "mutants-$crate" || true
              python3 .craftbook/tools/mutation_score.py "mutants-$crate/mutants.out/outcomes.json" "$2" || status=1
            done
          }
          gate shared-kernel 85
          gate domain 80
          gate app 70
          exit $status

  miri:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The crate with unsafe code: the AVX2 bit-packing kernels (chapter 4 §4.6).
      - run: cargo +nightly miri test --package substrate-data --lib

  # Without optional features, and the benchmarks built.
  features-and-benches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo bench --workspace --no-run

  # The Java port against the language-neutral conformance vectors.
  port-java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ports/java/pom.xml
      - run: mvn -B -f ports/java/pom.xml verify

  # The TypeScript port: built and run against the conformance vectors.
  port-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ports/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ports/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
