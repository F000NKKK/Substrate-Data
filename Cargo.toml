[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["F000NK"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/F000NKKK/Substrate-Data"

[workspace.dependencies]
substrate-data = { path = "crates/substrate-data", version = "0.1" }
substrate-data-derive = { path = "crates/substrate-data-derive", version = "0.1" }
base64 = "0.22"
bumpalo = { version = "3", features = ["collections"] }
toml = { version = "0.9", default-features = false }
serde_spanned = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
criterion = { version = "0.5", default-features = false }
