# Craftbook cargo-deny baseline. Copy to the workspace root as deny.toml.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Dev-dependencies of the benchmarks only; none is in the shipped crates.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained; it is a dev-dependency of the benches (the format compared against, and a dependency of iai-callgrind)" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained; it comes with iai-callgrind, a dev-dependency of the benches" },
]

[licenses]
version = 2
# Permissive licences only; add a licence here by Craftbook PR, not locally.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# The workspace's own crates carry the project's licence (it may be AGPL or
# commercial); only third-party crates are checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency between workspace crates carries no version (the derive's
# dev-dependency on its own host; see crates/substrate-data-derive/Cargo.toml).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
